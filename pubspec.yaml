name: fasting_tracker_app
description: "A new Flutter project for fasting tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  flutter_localizations:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.1

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts & Notifications
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.1.2

  # Utilities
  intl: ^0.20.3
  timezone: ^0.9.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/