name: fasting_tracker_app
description: "A new Flutter project for fasting tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts & Notifications
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.1.2

  # Utilities
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true